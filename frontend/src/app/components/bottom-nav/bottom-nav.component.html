<nav class="ha-bottom-nav" aria-label="Mobile navigation" role="navigation">
  <div class="bottom-nav-container">
    <!-- 1. Home -->
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="bottom-nav-item"
      id="bottom-nav-home"
      aria-label="Home"
    >
      <div class="nav-icon-wrapper">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="nav-label">Home</span>
    </a>

    <!-- 2. Learn / Topics -->
    <a
      routerLink="/topics"
      routerLinkActive="active"
      class="bottom-nav-item"
      id="bottom-nav-topics"
      aria-label="Learn health topics"
    >
      <div class="nav-icon-wrapper">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        @if (completedLessonsCount() > 0) {
          <span class="nav-badge" aria-label="Completed lessons">{{ completedLessonsCount() }}</span>
        }
      </div>
      <span class="nav-label">Learn</span>
    </a>

    <!-- 3. Report Concern (Primary Action) -->
    <a
      routerLink="/report"
      routerLinkActive="active"
      class="bottom-nav-item bottom-nav-item--highlight"
      id="bottom-nav-report"
      aria-label="Report a community concern"
    >
      <div class="nav-icon-wrapper nav-icon-wrapper--raised">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <span class="nav-label">Report</span>
    </a>

    <!-- 4. Track Concerns -->
    <a
      routerLink="/track"
      routerLinkActive="active"
      class="bottom-nav-item"
      id="bottom-nav-track"
      aria-label="Track reported concerns"
    >
      <div class="nav-icon-wrapper">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>
      <span class="nav-label">Track</span>
    </a>
  </div>
</nav>
